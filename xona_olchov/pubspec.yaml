name: xona_olchov
description: "Xona o'lchamlarini chizma, yuza va lokatsiya bilan saqlaydigan ilova."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.3
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  connectivity_plus: ^7.3.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: "launcher_icon"
  adaptive_icon_background: "#151515"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#151515"
