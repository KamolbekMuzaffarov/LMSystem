# ============================================================================
# Aurora Academy LMS  ·  Supabase CLI configuration
# ----------------------------------------------------------------------------
# Local dev / migration config. Migrations in ./migrations are applied in
# filename order by `supabase db reset` / `supabase db push`. Seed data in
# ./seed.sql runs after migrations on `supabase db reset`.
#
# Quick start (local):
#   supabase start          # boot local stack (Postgres, Auth, Studio, ...)
#   supabase db reset       # apply all migrations + run seed.sql
#
# Apply to a hosted project (later):
#   supabase link --project-ref <ref>
#   supabase db push        # push migrations to the linked project
# ============================================================================

# A string used to distinguish different Supabase projects on the same host.
project_id = "aurora-academy-lms"

[api]
enabled = true
port = 54321
# Schemas exposed via the auto-generated REST/GraphQL APIs.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# Max rows returned by a single REST request.
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# The major PostgreSQL version. Must match the hosted project (15).
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

# Run ./seed.sql automatically on `supabase db reset`.
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Catch outbound emails locally (Inbucket) instead of sending them.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# The site URL the client app runs on (used for redirects & email links).
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Allow self-service signups (handled by the on_auth_user_created trigger).
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
# Local dev: don't require email confirmation. Enable in production.
enable_confirmations = false
double_confirm_changes = true
secure_password_change = false

# Uzbek market: phone/OTP can be enabled once an SMS provider is wired up.
[auth.sms]
enable_signup = false
enable_confirmations = false

# Example external OAuth provider (disabled by default).
[auth.external.google]
enabled = false

[analytics]
enabled = false
