name: Hisob APK

# "Hisob" Flutter ilovasini release APK sifatida yig'adi.
# Natija: Actions artifact + GitHub Release (APK biriktirilgan).

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'xona_olchov/**'
      - '.github/workflows/hisob-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hisob-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xona_olchov
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      # Universal APK (barcha ABI) + har bir ABI uchun alohida kichik APK.
      - name: Build APK (universal)
        run: flutter build apk --release

      - name: Build APK (per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Name the APKs
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ' | cut -d+ -f1)"
          OUT=build/app/outputs/flutter-apk
          mkdir -p build/dist
          cp "$OUT/app-release.apk"               "build/dist/Hisob-${VERSION}.apk"
          cp "$OUT/app-arm64-v8a-release.apk"     "build/dist/Hisob-${VERSION}-arm64.apk"
          cp "$OUT/app-armeabi-v7a-release.apk"   "build/dist/Hisob-${VERSION}-armv7.apk"
          cp "$OUT/app-x86_64-release.apk"        "build/dist/Hisob-${VERSION}-x86_64.apk"
          ls -la build/dist
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hisob-${{ env.APP_VERSION }}-build${{ github.run_number }}
          path: xona_olchov/build/dist/*.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hisob-v${{ env.APP_VERSION }}-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Hisob v${{ env.APP_VERSION }} (build ${{ github.run_number }})
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: xona_olchov/build/dist/*.apk
          body: |
            **Hisob** — xona o'lchamlari, chizma va yuza.

            - Branch: `${{ github.ref_name }}`
            - Commit: ${{ github.sha }}

            Fayllar (hammasi bir xil kalit bilan imzolangan):
            - `Hisob-${{ env.APP_VERSION }}-arm64.apk` — zamonaviy telefonlar uchun (tavsiya etiladi, eng kichik)
            - `Hisob-${{ env.APP_VERSION }}-armv7.apk` — eski 32-bit qurilmalar
            - `Hisob-${{ env.APP_VERSION }}-x86_64.apk` — emulyator / x86 planshetlar
            - `Hisob-${{ env.APP_VERSION }}.apk` — universal (barcha ABI, katta hajm)

            O'rnatish: APK'ni telefonga yuklab olib oching; "Noma'lum manbalar"ga ruxsat bering.
